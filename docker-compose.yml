version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fuel_monitor
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: fuel_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_user -d fuel_monitor"]
      interval: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=fuel_monitor
      - POSTGRES_USER=fuel_user
      - POSTGRES_PASSWORD=fuel_password
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
